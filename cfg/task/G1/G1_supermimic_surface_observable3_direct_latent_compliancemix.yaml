# @package task
defaults:
  - /task/G1/G1_supermimic_online_estimated_root3_crouch20_force_history_direct_latent
  - _self_

name: G1SuperMimicSurfaceObservable3DirectLatentComplianceMix

# Matched to the direct-latent 3KP ComplianceMix PPO experiment. Only the
# force-generation mechanism changes: choose up to three observable surface
# contacts from the whole robot and apply Cartesian springs toward the next
# motion frame. Keep the same six causal force-history offsets.
command:
  _target_: active_adaptation.envs.mdp.commands.observable_surface.ObservableSurfaceCommand
  surface_path: /home/xl521/feet_reach/artifacts/surface_compliance/geometry
  contact_mode: random
  max_contacts: 3
  population: 12
  position_iterations: 4
  selection_chunk: 64
  history_offsets: [0, 1, 2, 4, 8, 16]
  geometry_path: /home/xl521/feet_reach/artifacts/ceer_segmented_jacobian/geometry.json
  pool_size: 128
  upper_body: false
  full_span: true
  coverage_prior: 0.3
  covariance_path: null
  spring_k: 80.0
  contact_period: 0.8

observation:
  force_gt_:
    dense_force_gt:
      enabled: false
    surface_contacts: {}
