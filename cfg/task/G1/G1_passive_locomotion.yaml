# @package task
defaults:
- /task/G1/G1
- _self_
name: G1PassiveLocomotion
observe_on_reset: true
num_envs: 1024
max_episode_length: 500
robot:
  name: g1_col_full
flags: []
objects: []
action:
  _target_: active_adaptation.envs.mdp.action.JointPosition
  action_scaling:
    .*: 0.5
  max_delay: 0
  alpha:
  - 1.0
  - 1.0
  boot_protect: false
command:
  _target_: active_adaptation.envs.mdp.commands.passive_locomotion.PassiveLocomotionCommand
  student_train: false
  joint_patterns:
  - .*
  ignore_joint_patterns: []
  dataset:
    mem_paths:
    - passive_locomotion_simple/train/move
    - passive_locomotion_simple/train/hold
    path_weights:
    - 0.8
    - 0.2
    sample_once: true
    position_z_offset: 0.0
    clamp_joint_targets: false
    buffer_float_dtype: float32
  dataset_extra_keys:
  - name: is_hold
    shape: 1
    dtype: float32
  init_noise:
    root_pos: 0.0
    root_ori: 0.0
    root_lin_vel: 0.0
    root_ang_vel: 0.0
    joint_pos: 0.0
    joint_vel: 0.0
  reward_sigma:
    root_pos:
    - 0.3
    root_vel:
    - 1.0
    - 0.5
    root_rot:
    - 1.0
    - 0.5
    root_ang_vel:
    - 3.0
    keypoint:
    - 0.3
    lower_keypoint:
    - 0.3
    joint_pos:
    - 0.4
    - 0.2
    joint_vel:
    - 2.0
    - 1.0
    ee:
    - 0.2
    ee_rot:
    - 1.0
    - 0.5
    feet:
    - 0.06
observation:
  policy:
    root_ang_vel_history:
      history_steps:
      - 0
      noise_std: 0.02
    projected_gravity_history:
      history_steps:
      - 0
      noise_std: 0.005
    joint_pos_history:
      history_steps:
      - 0
      - 1
      - 2
      - 3
      - 4
      noise_std: 0.003
    prev_actions:
      steps: 3
    body_guidance_wrench_b: {}
  joint_target:
    target_joint_pos_obs: {}
  priv:
    target_pos_b_obs: {}
    target_linvel_b_obs: {}
    relative_quat_obs: {}
    target_projected_gravity_b: {}
    root_linvel_b: {}
    current_keypoint_b: {}
    current_keypoint_vel_b: {}
    target_keypoints_diff_b_obs: {}
    applied_torque: {}
  priv_critic:
    cum_error: {}
reward:
  _student_train_: false
  tracking:
    root_pos_tracking:
      weight: 0.5
    root_rot_tracking:
      weight: 0.5
    root_vel_tracking:
      weight: 1.0
    root_ang_vel_tracking:
      weight: 1.0
    joint_pos_tracking:
      weight: 1.0
    joint_vel_tracking:
      weight: 0.5
    ee_rot_tracking:
      weight: 0.0
      enabled: false
    keypoint_tracking:
      weight: 1.0
  loco:
    survival:
      weight: 5.0
      enabled: true
    impact_force_l2:
      weight: 4.0
      enabled: true
      body_names: .*ankle_roll_link
    feet_slip:
      weight: 2.0
      enabled: true
      body_names: .*ankle_roll_link
    joint_vel_l2:
      weight: 0.0005
      enabled: true
      joint_names: .*
    action_rate_l2:
      weight: 0.2
      enabled: true
    feet_air_time_ref:
      weight: 10.0
      enabled: true
      body_names:
      - left_ankle_roll_link
      - right_ankle_roll_link
      thres: 0.8
    joint_pos_limits:
      weight: 1.0
      joint_names: .*
      soft_factor: 0.9
      enabled: true
    feet_contact_count:
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link
randomization: {}
termination:
  cum_error:
    thres: 1.0
    min_steps: 50
