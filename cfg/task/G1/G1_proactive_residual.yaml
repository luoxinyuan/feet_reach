# @package task
# Frozen CEER; nominal trajectories supply commands, not whole-body reward.
defaults:
- /task/G1/G1
- _self_
name: G1ProactiveResidual
proactive_contact: true
observe_on_reset: true
num_envs: 1024
max_episode_length: 500
robot:
  name: g1_col_full
flags: []
objects:
- type: wall
  name: reach_wall
  pos:
  - 0.475
  - 0.15
  - 1.0
  size:
  - 0.05
  - 1.0
  - 1.0
  friction: 0.6
action:
  _target_: active_adaptation.envs.mdp.action.HierarchicalRootCommand
  _recursive_: false
  command_dim: 3
  apply_root_command: false
  low_policy_command_slice: null
  root_command:
    enabled: false
  ee_command:
    enabled: true
    mode: left_pos_delta
    pos_scale:
    - 0.15
    - 0.15
    - 0.15
  low_policy:
    checkpoint_path: .cache/ceer/checkpoint_final.pt
    phase: adapt
    vecnorm: eval
    in_keys:
    - policy
    - priv
    - joint_target
    - priv_critic
    preload: true
  low_action:
    _target_: active_adaptation.envs.mdp.action.JointPosition
    action_scaling:
      .*elbow_joint: 1.0
      .*shoulder.*: 1.0
      .*wrist.*: 1.0
      .*hip_roll.*: 0.25
      .*hip_yaw.*: 0.25
      .*hip_pitch.*: 0.5
      .*knee.*: 0.5
      .*waist.*: 0.25
      .*ankle.*: 0.5
    max_delay: 4
    alpha:
    - 0.9
    - 0.9
    alpha_wide:
    - 0.8
    - 1.0
    alpha_jit_scale: 0.025
    boot_protect: true
command:
  _target_: active_adaptation.envs.mdp.commands.proactive_residual.ProactiveResidualCommand
  geometry_points: 128
  no_wall_prob: 0.25
  wall_range:
  - 0.4
  - 0.5
  force_rate_soft: 500.0
  student_train: false
  foot_force:
    enabled: false
  sole_offset:
  - 0.0
  - 0.0
  - -0.03540915
  joint_patterns:
  - .*
  ignore_joint_patterns: []
  dataset:
    mem_paths:
    - ee_reach/train
    path_weights:
    - 1.0
    sample_once: false
    position_z_offset: 0.0
    clamp_joint_targets: false
    buffer_float_dtype: float32
  dataset_extra_keys: []
  init_noise:
    root_pos: 0.0
    root_ori: 0.0
    root_lin_vel: 0.0
    root_ang_vel: 0.0
    joint_pos: 0.0
    joint_vel: 0.0
  reward_sigma:
    root_pos:
    - 0.3
    root_vel:
    - 1.0
    - 0.5
    root_rot:
    - 1.0
    - 0.5
    root_ang_vel:
    - 3.0
    keypoint:
    - 0.3
    lower_keypoint:
    - 0.3
    joint_pos:
    - 0.4
    - 0.2
    joint_vel:
    - 2.0
    - 1.0
    ee:
    - 0.2
    ee_rot:
    - 1.0
    - 0.5
    feet:
    - 0.06
  ceer_force_limit: 30.0
observation:
  policy:
    boot_indicator_state: {}
    command: {}
    root_and_wrist_6d: {}
    root_ang_vel_history:
      history_steps:
      - 0
      noise_std: 0.05
    projected_gravity_history:
      history_steps:
      - 0
      noise_std: 0.01
    joint_pos_history:
      history_steps:
      - 0
      - 1
      - 2
      - 3
      - 4
      noise_std: 0.005
    prev_actions:
      steps: 3
  geometry_:
    geometry_cloud: {}
  joint_target:
    target_joint_pos_obs: {}
  priv:
    target_pos_b_obs: {}
    target_linvel_b_obs: {}
    relative_quat_obs: {}
    target_projected_gravity_b: {}
    root_linvel_b: {}
    current_keypoint_b: {}
    current_keypoint_vel_b: {}
    target_keypoints_diff_b_obs: {}
    applied_torque: {}
  priv_critic:
    cum_error: {}
  hl_policy:
    target_ee_pos_b: {}
    root_ang_vel_history:
      history_steps:
      - 0
      noise_std: 0.02
    projected_gravity_history:
      history_steps:
      - 0
      noise_std: 0.005
    joint_pos_history:
      history_steps:
      - 0
      - 1
      - 2
      - 3
      - 4
      noise_std: 0.003
    prev_actions:
      steps: 3
    prev_high_actions:
      steps: 3
  hl_priv:
    body_height:
      body_names:
      - pelvis
      - torso_link
      - .*ankle_roll_link
    contact_forces:
      body_names: .*ankle_roll_link
    root_linvel_b: {}
    current_keypoint_b: {}
    current_keypoint_vel_b: {}
    applied_torque: {}
reward:
  _student_train_: false
  tracking:
    left_ee_tracking:
      weight: 2.0
    contact_jump_cost:
      weight: 0.1
  loco:
    survival:
      weight: 5.0
      enabled: true
    impact_force_l2:
      weight: 4.0
      enabled: true
      body_names: .*ankle_roll_link
    feet_slip:
      weight: 2.0
      enabled: true
      body_names: .*ankle_roll_link
    joint_vel_l2:
      weight: 0.0005
      enabled: true
      joint_names: .*
    action_rate_l2:
      weight: 0.2
      enabled: true
    feet_air_time_ref:
      weight: 10.0
      enabled: true
      body_names:
      - left_ankle_roll_link
      - right_ankle_roll_link
      thres: 0.8
    joint_pos_limits:
      weight: 1.0
      joint_names: .*
      soft_factor: 0.9
      enabled: true
    feet_contact_count:
      weight: 1.0
      enabled: false
      body_names: .*ankle_roll_link
randomization: {}
termination:
  cum_error:
    thres: 1.0
    min_steps: 50
    enabled: false
  fall_over:
    xy_thres: 0.8
    z_thres: 0.5
  root_height_below:
    min_height: 0.55
